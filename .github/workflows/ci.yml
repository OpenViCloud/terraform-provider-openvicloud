name: CI

# Build, vet, unit tests, and the generated client matching the committed copy of the API contract
# (api/openapi-v1.json, synced from OpenViCloud/titan-control-plane by scripts/sync-spec.sh). Acceptance tests (TF_ACC) need a
# live OpenViCloud API and a token: they run on a machine with the dev cluster, never here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # titan-ops is private, so a link into it is a 404 for every reader of this repository; a titan-ops doc is named
      # `titan-ops <path under its docs/>#<anchor>` instead.
      - name: No URL into private titan-ops
        run: |
          if git grep -n -I -i -E 'github\.com/openvicloud/titan-ops([^[:alnum:]_-]|$)' -- ':/'; then
            echo "URL into private titan-ops above: write titan-ops <path>#<anchor>"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generated client matches the spec
        run: |
          go generate ./api/
          git diff --exit-code -- api/

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The registry pages are generated from the schema descriptions and examples/: a schema change must carry
      # its regenerated page.
      - name: Registry docs match the schema
        run: |
          terraform fmt -recursive -check examples
          go tool tfplugindocs generate --provider-name openvicloud
          go tool tfplugindocs validate --provider-name openvicloud
          git status --porcelain -- docs/
          test -z "$(git status --porcelain -- docs/)"

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -trimpath -o /dev/null .
